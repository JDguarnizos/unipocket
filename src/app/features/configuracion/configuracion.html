<div class="config-contenedor">

  <!-- ===== Cabecera ===== -->
  <div class="cabecera">
    <h2 class="titulo">Configuración</h2>
    <p class="subtitulo">Datos de tu cuenta y sesión</p>
  </div>

  <div class="grid-config">

    <!-- ===== Tarjeta 1: datos de la cuenta (solo lectura) ===== -->
    <section class="tarjeta">
      <h3 class="tarjeta-titulo">Mi cuenta</h3>
      <p class="tarjeta-subtitulo">Estos datos no se pueden editar en la versión de demostración</p>

      <!-- readonly: se pueden leer y copiar, pero no modificar -->
      <div class="campo">
        <label for="config-nombre">Nombre</label>
        <div class="input-grupo solo-lectura">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          <input id="config-nombre" type="text" [value]="usuario()?.nombre ?? ''" readonly>
        </div>
      </div>

      <div class="campo">
        <label for="config-correo">Correo</label>
        <div class="input-grupo solo-lectura">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          <input id="config-correo" type="email" [value]="usuario()?.correo ?? ''" readonly>
        </div>
      </div>

      <div class="campo">
        <label for="config-tipo">Tipo de cuenta</label>
        <div class="input-grupo solo-lectura">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <input id="config-tipo" type="text" [value]="tipoCuenta()" readonly>
        </div>
      </div>
    </section>

    <!-- ===== Tarjeta 2: sesión ===== -->
    <section class="tarjeta">
      <h3 class="tarjeta-titulo">Sesión</h3>
      <p class="tarjeta-subtitulo">Sal de tu cuenta en este navegador</p>

      <button type="button" class="btn btn-secundario" (click)="cerrarSesion()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Cerrar sesión
      </button>
    </section>

  </div>
</div>
