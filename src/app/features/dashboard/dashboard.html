<div class="dashboard-contenedor">
  <div class="cabecera-dashboard">
    <div>
      <h2>Hola, Laura</h2>
      <p class="fecha">Octubre 2026</p>
    </div>
    <div class="botones-accion">
            <!-- Cada botón abre el modal con su tipo ya seleccionado -->
      <app-boton-generico texto="Registrar ingreso" tipo="ingreso" (click)="abrirModal('ingreso')"></app-boton-generico>
      <app-boton-generico texto="Registrar gasto" tipo="gasto" (click)="abrirModal('gasto')"></app-boton-generico>
    </div>
  </div>

  <h3 class="titulo-seccion">Resumen rápido</h3>
  <div class="grid-tarjetas">
    <app-tarjeta-resumen 
      titulo="Dinero disponible" 
            [valorPrincipal]="formatearPesos(saldoDisponible())"
      textoSecundario="De $1.200.000 del periodo">
    </app-tarjeta-resumen>

    <app-tarjeta-resumen 
      titulo="Presupuesto utilizado" 
      valorPrincipal="68%" 
      textoSecundario="$340.000 de $500.000 - Dentro del límite">
    </app-tarjeta-resumen>

    <app-tarjeta-resumen 
      titulo="Gasto diario recomendado" 
      valorPrincipal="$13.300 / día" 
      textoSecundario="Para cerrar el mes sin pasarte">
    </app-tarjeta-resumen>
  </div>

  <h3 class="titulo-seccion">Movimientos recientes</h3>
  
    <div class="lista-movimientos">
    <!-- @for recorre la lista; los nuevos movimientos aparecen de primeros.
         movimientosRecientes() lleva paréntesis porque es un signal (computed) -->
    @for (mov of movimientosRecientes(); track $index) {
      <app-item-movimiento
        [titulo]="mov.titulo"
        [subtitulo]="mov.subtitulo"
        [monto]="formatearPesos(mov.monto)"
        [tipo]="mov.tipo">
      </app-item-movimiento>
    }
  </div>
</div>

<!-- Modal "Registrar movimiento": solo existe en pantalla cuando modalAbierto es true -->
@if (modalAbierto) {
  <app-registro-movimiento
    [tipoInicial]="tipoModal"
    (cerrado)="cerrarModal()"
    (guardado)="registrarMovimiento($event)">
  </app-registro-movimiento>
}
