<div class="dashboard-contenedor">
  <div class="cabecera-dashboard">
    <div>
      <h2>Hola, {{ usuario()?.nombre ?? 'Usuario' }}</h2>
      <p class="fecha">{{ mesActual }}</p>
    </div>
    <div class="botones-accion">
      <app-boton-generico texto="Registrar ingreso" tipo="ingreso" (click)="abrirModal('ingreso')"></app-boton-generico>
      <app-boton-generico texto="Registrar gasto" tipo="gasto" (click)="abrirModal('gasto')"></app-boton-generico>
    </div>
  </div>

  <h3 class="titulo-seccion">Resumen rápido</h3>
  <div class="grid-tarjetas">
    <!-- Tarjeta 1: Dinero disponible -->
    <app-tarjeta-resumen 
      titulo="Dinero disponible" 
      [valorPrincipal]="formatearPesos(saldoDisponible())"
      [textoSecundario]="'De ' + formatearPesos(registroActual()?.totalIngresos ?? 0) + ' del periodo'">
    </app-tarjeta-resumen>

    <!-- Tarjeta 2: Presupuesto utilizado -->
    <app-tarjeta-resumen 
      titulo="Presupuesto utilizado" 
      [valorPrincipal]="porcentajePresupuesto() + '%'" 
      [textoSecundario]="formatearPesos(registroActual()?.totalGastos ?? 0) + ' de ' + formatearPesos(registroActual()?.presupuesto ?? 0)">
    </app-tarjeta-resumen>

    <!-- Tarjeta 3: Gasto diario recomendado -->
    <app-tarjeta-resumen 
      titulo="Gasto diario recomendado" 
      [valorPrincipal]="formatearPesos(gastoDiarioRecomendado()) + ' / día'" 
      [textoSecundario]="presupuestoRestante() >= 0
        ? 'Te quedan ' + formatearPesos(presupuestoRestante()) + ' para ' + diasRestantes() + ' días'
        : 'Te pasaste por ' + formatearPesos(-presupuestoRestante())">
    </app-tarjeta-resumen>
  </div>

  <h3 class="titulo-seccion">Movimientos recientes</h3>
  
  <div class="lista-movimientos">
    @for (mov of movimientosRecientes(); track $index) {
      <app-item-movimiento
        [titulo]="mov.titulo"
        [subtitulo]="mov.subtitulo"
        [monto]="formatearPesos(mov.monto)"
        [tipo]="mov.tipo">
      </app-item-movimiento>
    }
  </div>
</div>

@if (modalAbierto) {
  <app-registro-movimiento
    [tipoInicial]="tipoModal"
    (cerrado)="cerrarModal()"
    (guardado)="registrarMovimiento($event)">
  </app-registro-movimiento>
}
